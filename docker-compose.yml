# Stack completa: API FastAPI + PostgreSQL 15 + Jaeger all-in-one.
# `docker compose up --build` sobe tudo sem nenhum passo manual: as tabelas sao
# criadas no lifespan da aplicacao via create_all (decisao D5).
# Sem a chave `version:` - ela e obsoleta no Compose v2+.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dq-net

  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP/gRPC (decisao D6)
      - "4318:4318"    # OTLP/HTTP
    networks:
      - dq-net

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dq:dq@postgres:5432/dq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: "false"
      ENVIRONMENT: docker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - dq-net

networks:
  dq-net:
    driver: bridge

volumes:
  pgdata:

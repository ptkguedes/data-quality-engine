# Stack completa: API FastAPI + PostgreSQL 15 + Jaeger all-in-one.
# `docker compose up --build` sobe tudo sem nenhum passo manual: as tabelas sao
# criadas no lifespan da aplicacao via create_all (decisao D5).
# Sem a chave `version:` - ela e obsoleta no Compose v2+.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dq
      # Credencial de desenvolvimento local, parametrizada: exporte
      # POSTGRES_PASSWORD (ou coloque no .env) para subir a stack sem a senha
      # padrao conhecida.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dq}
      POSTGRES_DB: dq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dq-net

  jaeger:
    # Tag completa (1.62.0): o Jaeger nao publica mais o alias curto `1.62`.
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP/gRPC (decisao D6)
      - "4318:4318"    # OTLP/HTTP
    networks:
      - dq-net

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dq:${POSTGRES_PASSWORD:-dq}@postgres:5432/dq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SDK_DISABLED: "false"
      ENVIRONMENT: docker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Sem curl na imagem python:3.12-slim: o liveness roda pela stdlib.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dq-net

networks:
  dq-net:
    driver: bridge

volumes:
  pgdata:
